name: Сборка ядра стенда

# Релиз публикуется по тегу вида kmc-6.8.12-N. Конвейер проверки лабораторных
# (labs/common/fetch_kernel.py) скачивает ядро из релиза с тегом, зафиксированным
# в labs/common/kernel.env, — поэтому новый тег ничего не меняет у студентов,
# пока его явно не пропишут туда.
on:
  push:
    tags: ["kmc-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        flavor: [stand, debug]
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости сборки ядра
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc cpio kmod rsync \
              libelf-dev libssl-dev dpkg-dev debhelper python3
      - name: Сборка (${{ matrix.flavor }})
        run: ./build.sh ${{ matrix.flavor }} out
      - uses: actions/upload-artifact@v4
        with:
          name: kmc-${{ matrix.flavor }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Ядро стенда курса: варианты stand и debug (KASAN, UBSAN, lockdep). Сборка из тега $GITHUB_REF_NAME." \
              *
